<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة | رشا وهاني</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle at center, #181610 0%, #070708 80%);
        }
        .error-code {
            font-family: var(--font-heading);
            font-size: 8rem;
            color: var(--gold-bright);
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: var(--gold-glow);
        }
        .error-title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #FFF;
        }
        .error-desc {
            color: var(--text-muted);
            max-width: 500px;
            margin-bottom: 35px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">الصفحة التي تبحث عنها غير موجودة</h1>
        <p class="error-desc">يبدو أنك ضللت الطريق، ولكن الحب دائمًا يعيدنا إلى المسار الصحيح ❤️</p>
        <a href="index.html" class="cta-button">
            <span>العودة إلى الصفحة الرئيسية</span>
            <i class="fas fa-home"></i>
        </a>
    </div>
</body>
</html>
